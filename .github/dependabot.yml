version: 2
updates:
  # The actions in .github/workflows, so CI doesn't break when GitHub retires
  # an old major version. Third-party actions are pinned to a commit with the
  # version in a comment (see tests.yml); Dependabot moves both to each new
  # release. It can't update the docker:// actionlint image or the Trivy and
  # PostgreSQL images tests.yml and scan.yml run, so those are updated by hand.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # The base images in the Dockerfile. Weekly, since a security fix that's
  # only in a new base image can't reach the image any other way.
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly

  # The backend's crates. Minor and patch updates are grouped into one pull
  # request; a new major version gets its own, since it can need code changes.
  - package-ecosystem: cargo
    directory: /backend
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      crates:
        update-types: ["minor", "patch"]

  # The frontend's packages. All of them are build tools (devDependencies),
  # pinned to exact versions so every build is the same.
  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      packages:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 (the native compiler) has no JavaScript API yet, which
      # svelte-check and SvelteKit 3 need; they accept TypeScript 6 only.
      # Remove this once svelte-check supports 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
