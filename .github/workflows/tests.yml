name: Tests

on:
  push:
  pull_request:
  # Weekly, so a new base image or a crate that breaks the build shows up
  # even without a push, and the image picks up Debian's security fixes.
  # GitHub only runs this on the default branch, develop, from its copy of
  # this file, and pauses it after 60 days without repository activity.
  # main is rebuilt afterwards (see rebuild-latest).
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Every job can only read the repository, except the three that need more:
# docker and publish (push the image to the GitHub Container Registry; docker
# also uploads its scan to the Security tab), and rebuild-latest (starts a
# run).
#
# Actions from anyone but GitHub are pinned to a commit, not a tag, since a
# tag can be moved to other code: docker and publish hand them the Docker Hub
# token. The comment after each pin is its version, which Dependabot reads
# and updates along with the commit.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned by digest, like actionlint below; Dependabot can't update it.
  POSTGRES_IMAGE: postgres:18@sha256:64c8b0d31e4ab6ea665e8426ea406a94bf52de3c05b3a4a8bf713704eefa9328

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # This workflow, including shellcheck on its scripts. Pinned, so a new
      # release with new checks can't suddenly fail the job, and to its digest,
      # since an image tag can be moved too. Dependabot doesn't update images
      # used this way, so update the tag and digest by hand.
      - name: Lint the workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      - name: Lint the Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
      # The README, the pages in docs/, the changelog and everything in
      # .github, with the settings in .markdownlint.json.
      - name: Lint the Markdown files
        uses: DavidAnson/markdownlint-cli2-action@3ce8f712b5d8f31acd8e201be6d97e3d2bb23eb7 # v25.1.0
        with:
          globs: |
            **/*.md
            !**/node_modules/**

  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://rollcall:rollcall@localhost:5432/rollcall
      # Compile the queries against the committed .sqlx metadata, so a stale
      # copy fails the build. The tests still use DATABASE_URL at runtime:
      # #[sqlx::test] creates a fresh database for each test and migrates it.
      SQLX_OFFLINE: "true"
    services:
      postgres:
        image: postgres:18@sha256:64c8b0d31e4ab6ea665e8426ea406a94bf52de3c05b3a4a8bf713704eefa9328
        env:
          POSTGRES_USER: rollcall
          POSTGRES_PASSWORD: rollcall
          POSTGRES_DB: rollcall
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rollcall"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      # rustup is on GitHub's runners already, so no third-party action.
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            backend/target
          key: cargo-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  frontend:
    name: Frontend (SvelteKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      IMAGE: rollcall:ci
      # Pinned by digest, like actionlint; Dependabot can't update it.
      TRIVY: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
      PUBLISH: >-
        ${{ github.repository == 'tronyx/rollcall'
        && github.event_name != 'pull_request'
        && (github.ref_name == 'main' || github.ref_name == 'develop') }}
      # GHCR needs nothing but the workflow's own token. Docker Hub is added
      # once its secrets exist (see publish), so a missing secret never
      # holds up the GHCR image.
      DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    # Naming the shell adds -o pipefail, which GitHub's default bash lacks.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUBLISH == 'true' && env.DOCKERHUB == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # One build with two outputs: loaded into Docker as $IMAGE for the steps
      # below, and (when publishing) pushed by digest. No cache, and fresh
      # pulls of the base images, so every build gets the newest Debian
      # packages.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          pull: true
          no-cache: true
          labels: org.opencontainers.image.revision=${{ github.sha }}
          outputs: |
            type=docker,name=${{ env.IMAGE }}
            type=image,"name=${{ env.DOCKERHUB == 'true' && 'tronyx/rollcall,' || '' }}ghcr.io/tronyx/rollcall",push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
      # Starts the image like a user would, next to PostgreSQL 18, and checks
      # that it migrates the database, serves the API and the web interface,
      # and saves a spool.
      - name: Run the image like a user
        run: |
          docker network create rollcall
          docker run -d --name db --network rollcall \
            -e POSTGRES_USER=rollcall -e POSTGRES_PASSWORD=rollcall -e POSTGRES_DB=rollcall "$POSTGRES_IMAGE"
          for _ in $(seq 60); do docker exec db pg_isready -U rollcall -q && break; sleep 1; done
          docker run -d --name app --network rollcall -p 8080:8080 \
            -e DATABASE_URL=postgres://rollcall:rollcall@db:5432/rollcall "$IMAGE"
          for _ in $(seq 60); do curl -fsS http://localhost:8080/api/health && break; sleep 1; done
          echo
          test "$(docker inspect --format '{{.Config.User}}' "$IMAGE")" = "10001"
          curl -fsS http://localhost:8080/ | grep -q '<title>Rollcall</title>'
          curl -fsS http://localhost:8080/some/client/route | grep -q '<title>Rollcall</title>'
          curl -fsS http://localhost:8080/api/materials | grep -q '"code":"PETG"'
          curl -fsS -X POST http://localhost:8080/api/spools -H 'content-type: application/json' \
            -d '{"filament":{"brand_name":"CI","material_code":"PLA","color_name":"Black"},"initial_weight_g":1000}' \
            | grep -q '"brand_name":"CI"'
          curl -fsS http://localhost:8080/api/stats | grep -q '"spools_in_stock":1'
      - name: Server log
        if: always()
        run: docker logs app 2>&1 | tail -50 || true
      # Known vulnerabilities in the image's packages that have a fix: all of
      # them listed here and, except for pull requests, in the Security tab;
      # a critical one fails the job, so the image isn't published. Scanned
      # once, then converted, so the report and the check agree. A Trivy
      # outage only skips the scan.
      - name: Scan for vulnerabilities
        id: trivy
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP:/out" "$TRIVY" \
            image --scanners vuln --ignore-unfixed --format json --output /out/trivy.json "$IMAGE"
          docker run --rm -v "$RUNNER_TEMP:/out" "$TRIVY" convert --scanners vuln --format table /out/trivy.json
          docker run --rm -v "$RUNNER_TEMP:/out" "$TRIVY" convert --format sarif --output /out/trivy.sarif /out/trivy.json
      - name: Upload the scan to the Security tab
        if: github.event_name != 'pull_request' && steps.trivy.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/trivy.sarif
          category: trivy-${{ matrix.arch }}
      # After the upload, so a finding that blocks publishing is in the Security tab too.
      - name: Fail on fixable critical vulnerabilities
        if: steps.trivy.outcome == 'success'
        run: |
          docker run --rm -v "$RUNNER_TEMP:/out" "$TRIVY" convert --quiet --format table \
            --severity CRITICAL --exit-code 1 /out/trivy.json
      # Only reached if every step above passed, so only tested images get one.
      - name: Save the pushed digest for the publish job
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST" || { echo "::error::The build reported no digest"; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Publishes the tested images to Docker Hub and the GitHub Container
  # Registry, once every other job has passed: main as "latest", develop as
  # "develop", each covering amd64 and arm64. Nothing is built here; it only
  # tags the digests the docker jobs pushed. Pull requests never publish.
  #
  # GHCR (ghcr.io/tronyx/rollcall) needs no setup: the workflow's own token
  # pushes it. Docker Hub (tronyx/rollcall) is added once two repository
  # secrets exist: DOCKERHUB_USERNAME, and DOCKERHUB_TOKEN, a Docker Hub
  # personal access token with Read & Write access.
  publish:
    name: Publish the Docker image
    needs: [lint, backend, frontend, docker]
    if: >-
      github.repository == 'tronyx/rollcall'
      && github.event_name != 'pull_request'
      && (github.ref_name == 'main' || github.ref_name == 'develop')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Two quick pushes publish in order, rather than racing each other.
    concurrency:
      group: publish-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      DOCKERHUB: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.DOCKERHUB == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The annotations are what Docker Hub and GitHub show for the image.
      - name: Tag the tested images
        working-directory: ${{ runner.temp }}/digests
        env:
          TAG: ${{ github.ref_name == 'main' && 'latest' || 'develop' }}
          SOURCE: https://github.com/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          digests=(*)
          test "${#digests[@]}" -eq 2 || { echo "::error::Expected 2 digests, got: ${digests[*]}"; exit 1; }
          repos=(ghcr.io/tronyx/rollcall)
          if [ "$DOCKERHUB" = true ]; then repos+=(tronyx/rollcall); fi
          for repo in "${repos[@]}"; do
            docker buildx imagetools create -t "$repo:$TAG" \
              --annotation "index:org.opencontainers.image.title=rollcall" \
              --annotation "index:org.opencontainers.image.description=Self-hosted 3D printer filament inventory." \
              --annotation "index:org.opencontainers.image.source=$SOURCE" \
              --annotation "index:org.opencontainers.image.revision=$REVISION" \
              --annotation "index:org.opencontainers.image.licenses=MIT" \
              "${digests[@]/#/$repo@sha256:}"
            docker buildx imagetools inspect "$repo:$TAG"
          done

  # The weekly run only tests and rebuilds develop. Once all of it has passed,
  # this starts the workflow on main, from main's own copy of this file,
  # so "latest" is rebuilt and retested too. Nothing is pushed to main: a
  # started run needs no commit. If develop's run fails, latest waits a week.
  rebuild-latest:
    name: Rebuild latest from main
    needs: publish
    if: github.event_name == 'schedule' && github.ref_name == 'develop'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run tests.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
