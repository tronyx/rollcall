name: Docker image

# Builds the image for amd64 and arm64 on native runners and, for pushes to
# develop, publishes it to the GitHub Container Registry as
# ghcr.io/tronyx/rollcall:develop. Pull requests only build and smoke-test
# it. GHCR needs no secrets: the workflow's own token pushes the image.

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/tronyx/rollcall
  PUBLISH: >-
    ${{ github.repository == 'tronyx/rollcall'
    && github.event_name != 'pull_request'
    && github.ref_name == 'develop' }}

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # Loaded into Docker as rollcall:ci for the smoke test, and (when
      # publishing) pushed by digest for the publish job to tag.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          pull: true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0-only
          outputs: |
            type=docker,name=rollcall:ci
            type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ env.PUBLISH }}
      # Starts the image next to PostgreSQL 18 and checks that it migrates
      # the database, serves the API and the web interface, and saves a spool.
      - name: Run the image like a user
        run: |
          docker network create rollcall
          docker run -d --name db --network rollcall \
            -e POSTGRES_USER=rollcall -e POSTGRES_PASSWORD=rollcall -e POSTGRES_DB=rollcall postgres:18
          for _ in $(seq 60); do docker exec db pg_isready -U rollcall -q && break; sleep 1; done
          docker run -d --name app --network rollcall -p 8080:8080 \
            -e DATABASE_URL=postgres://rollcall:rollcall@db:5432/rollcall rollcall:ci
          for _ in $(seq 60); do curl -fsS http://localhost:8080/api/health && break; sleep 1; done
          echo
          curl -fsS http://localhost:8080/ | grep -q '<title>Rollcall</title>'
          curl -fsS http://localhost:8080/api/materials | grep -q '"code":"PETG"'
          curl -fsS -X POST http://localhost:8080/api/spools -H 'content-type: application/json' \
            -d '{"filament":{"brand_name":"CI","material_code":"PLA","color_name":"Black"},"initial_weight_g":1000}' \
            | grep -q '"brand_name":"CI"'
      - name: Server log
        if: always()
        run: docker logs app 2>&1 | tail -50 || true
      - name: Save the pushed digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST" || { echo "::error::The build reported no digest"; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Tags the two tested digests as one multi-arch :develop image.
  publish:
    name: Publish ghcr.io/tronyx/rollcall:develop
    needs: build
    if: >-
      github.repository == 'tronyx/rollcall'
      && github.event_name != 'pull_request'
      && github.ref_name == 'develop'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-develop
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tag the tested images
        working-directory: ${{ runner.temp }}/digests
        env:
          SOURCE: https://github.com/${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          digests=(*)
          test "${#digests[@]}" -eq 2 || { echo "::error::Expected 2 digests, got: ${digests[*]}"; exit 1; }
          docker buildx imagetools create -t "$IMAGE_NAME:develop" \
            --annotation "index:org.opencontainers.image.title=rollcall" \
            --annotation "index:org.opencontainers.image.description=Self-hosted 3D printer filament inventory." \
            --annotation "index:org.opencontainers.image.source=$SOURCE" \
            --annotation "index:org.opencontainers.image.revision=$REVISION" \
            --annotation "index:org.opencontainers.image.licenses=GPL-3.0-only" \
            "${digests[@]/#/$IMAGE_NAME@sha256:}"
          docker buildx imagetools inspect "$IMAGE_NAME:develop"
