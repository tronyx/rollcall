name: Backend

on:
  push:
    branches: [develop]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    branches: [develop]
    paths: ["backend/**", ".github/workflows/backend.yml"]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://rollcall:rollcall@localhost:5432/rollcall
  # Compile queries against the committed .sqlx metadata (the CI database is
  # empty until tests run migrations), so a stale cache fails the build.
  SQLX_OFFLINE: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: rollcall
          POSTGRES_PASSWORD: rollcall
          POSTGRES_DB: rollcall
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rollcall"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # #[sqlx::test] creates a fresh database per test and runs the migrations.
      - name: Test
        run: cargo test --locked
