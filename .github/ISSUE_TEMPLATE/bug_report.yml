name: 🐛 Bug report
description: Something went wrong, or Rollcall did something you didn't expect.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! Many surprises are explained in the [Troubleshooting](https://github.com/tronyx/rollcall/blob/main/docs/troubleshooting.md) guide, so please check there first.

        Found a security vulnerability? Please don't report it here; see the [security policy](https://github.com/tronyx/rollcall/security/policy) instead.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I've searched the existing issues and this hasn't been reported yet.
          required: true
        - label: I'm using the latest version, from the `main` branch or the `latest` Docker image.
          required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected to happen, and what happened instead. Screenshots help for anything in the web interface.
    validations:
      required: true

  - type: input
    id: product-link
    attributes:
      label: Product link
      description: If a product link was parsed wrongly, the link you pasted.
      placeholder: https://us.polymaker.com/products/...

  - type: textarea
    id: logs
    attributes:
      label: Server log
      description: |
        Anything the server printed around the problem. With Docker: `docker compose logs app --tail 100`. Set `RUST_LOG=rollcall=debug` for more detail.
      render: text

  - type: dropdown
    id: install
    attributes:
      label: How do you run Rollcall?
      options:
        - Docker image (docker compose)
        - Built from source
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The image tag and digest (`docker image inspect --format '{{.Id}}' tronyx/rollcall`), or the commit you built.
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Safari on iPhone 15 (iOS 19), Firefox 140 on Windows 11

  - type: textarea
    id: anything-else
    attributes:
      label: Anything else?
      description: Reverse proxy, PostgreSQL version, or anything else that might matter.
